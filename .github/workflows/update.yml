
name: Update NBA Stats and Schedule

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install pandas nba_api requests

      - name: Update NBA statistics
        run: python update_nba.py

      - name: Update NBA schedule
        run: python update_schedule.py

      - name: Update NBA news and injuries
        run: python update_news_injuries.py

      - name: Save prediction history and actual results
        run: python update_accuracy.py

      - name: Save updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nba_stats.csv
          git add nba_game_logs.csv
          git add nba_opponent_defense.csv
          git add nba_team_pace.csv
          git add nba_schedule.csv

          for f in nba_news.csv nba_injuries.csv nba_prediction_history.csv nba_prediction_results.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update NBA stats, schedule, injuries and prediction accuracy"
            git push
          fi
