
name: Refresh NBA Injuries Every 5 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: courtside-injuries
  cancel-in-progress: false

jobs:
  refresh-injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh ESPN injuries
        run: python -c "import update_news_injuries; update_news_injuries.injuries()"

      - name: Commit updated injury CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nba_injuries.csv

          if git diff --cached --quiet; then
            echo "No injury changes."
            exit 0
          fi

          git commit -m "Refresh NBA injury reports"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Injury CSV published."
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done

          echo "Could not publish injury CSV."
          exit 1
